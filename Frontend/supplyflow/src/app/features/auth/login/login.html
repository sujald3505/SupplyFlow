<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">

  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">

    <!-- Logo / Title -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-slate-900">
        SupplyFlow
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Inventory & Purchase Management System
      </p>
    </div>


    <!-- Error -->
    @if (errorMessage) {
      <div
        class="mb-5 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600">
        {{ errorMessage }}
      </div>
    }


    <!-- Form -->
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="space-y-5">

      <!-- Email -->
      <div>
        <label
          class="mb-2 block text-sm font-medium text-slate-700">
          Email Address
        </label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

        @if (email?.touched && email?.invalid) {
          <p class="mt-1 text-xs text-red-500">
            Please enter a valid email.
          </p>
        }
      </div>


      <!-- Password -->
      <div>
        <label
          class="mb-2 block text-sm font-medium text-slate-700">
          Password
        </label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

        @if (password?.touched && password?.invalid) {
          <p class="mt-1 text-xs text-red-500">
            Password must be at least 6 characters.
          </p>
        }
      </div>


      <!-- Submit -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full rounded-lg bg-blue-600 py-3 font-medium text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">

        @if (isLoading) {
          Logging in...
        } @else {
          Sign In
        }

      </button>

    </form>


    <!-- Register Link -->
    <div class="mt-6 border-t border-slate-100 pt-5 text-center">

      <p class="text-sm text-slate-500">

        Don't have an account?

        <a
          routerLink="/register"
          class="ml-1 font-semibold text-blue-600 transition hover:text-blue-700">

          Create account

        </a>

      </p>

    </div>


  </div>

</div>
